<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
<title id="title">Mavin Sandeep — Embedded IoT Systems Engineer</title>
<desc id="desc">Developer profile banner focused on embedded systems, IoT, firmware, connectivity and backend systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0891b2"/><stop offset=".5" stop-color="#4f46e5"/><stop offset="1" stop-color="#059669"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#06b6d4" stop-opacity=".13"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#0f172a" flood-opacity=".12"/></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#64748b" stroke-opacity=".07"/></pattern>
  <clipPath id="card"><rect x="20" y="20" width="1140" height="570" rx="30"/></clipPath>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{fill:#64748b}.bright{fill:#0f172a}.cyan{fill:#0e7490}.green{fill:#047857}.violet{fill:#4338ca}.pulse{animation:pulse 2.8s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}@keyframes float{50%{transform:translateY(-5px)}}
  </style>
</defs>
<g clip-path="url(#card)">
  <rect x="20" y="20" width="1140" height="570" rx="30" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="20" y="20" width="1140" height="570" fill="url(#grid)"/>
  <circle cx="980" cy="80" r="300" fill="url(#glow)"/>
  <rect x="20" y="20" width="1140" height="3" fill="url(#accent)"/>
  <g transform="translate(64 70)">
    <text class="cyan" font-size="15" letter-spacing="3">MAVIN SANDEEP / SYSTEMS PROFILE</text>
    <text y="58" class="bright" font-size="46" font-weight="700">Building systems that connect</text>
    <text y="106" class="bright" font-size="46" font-weight="700">the physical world to software.</text>
    <text y="143" class="muted" font-size="17">Embedded firmware · IoT · Connectivity · APIs · Linux infrastructure</text>
  </g>
  <g transform="translate(64 260)">
    <rect width="490" height="270" rx="20" fill="#ffffff" fill-opacity=".72" stroke="#cbd5e1"/>
    <text x="24" y="32" class="muted" font-size="13">CURRENT ENGINEERING STACK</text>
    <g transform="translate(24 58)" font-size="16">
      <rect width="442" height="38" rx="10" fill="#f8fafc"/><circle cx="20" cy="19" r="5" class="cyan pulse"/><text x="38" y="25" class="bright">ESP32 / STM32 / RL78 / Arduino</text>
      <rect y="48" width="442" height="38" rx="10" fill="#f8fafc"/><circle cx="20" cy="67" r="5" class="violet pulse"/><text x="38" y="73" class="bright">UART · SPI · I²C · RS485 · Modbus</text>
      <rect y="96" width="442" height="38" rx="10" fill="#f8fafc"/><circle cx="20" cy="115" r="5" class="green pulse"/><text x="38" y="121" class="bright">BLE · Wi-Fi · Cellular · GNSS · W5500</text>
      <rect y="144" width="442" height="38" rx="10" fill="#f8fafc"/><circle cx="20" cy="163" r="5" class="cyan pulse"/><text x="38" y="169" class="bright">HTTP · WebSocket · Python · Flask · React</text>
      <rect y="192" width="442" height="38" rx="10" fill="#f8fafc"/><circle cx="20" cy="211" r="5" class="green pulse"/><text x="38" y="217" class="bright">Linux · PM2 · systemd · Cloudflare</text>
    </g>
  </g>
  <g transform="translate(590 260)">
    <text class="muted" font-size="13">HOW I BUILD</text>
    <g class="float">
      <g transform="translate(0 30)"><rect width="145" height="72" rx="16" fill="#ffffff" stroke="#a5f3fc"/><text x="72" y="30" text-anchor="middle" class="cyan" font-size="13">HARDWARE</text><text x="72" y="51" text-anchor="middle" class="bright" font-size="14">Sensors / MCU</text></g>
      <g transform="translate(165 30)"><rect width="145" height="72" rx="16" fill="#ffffff" stroke="#c7d2fe"/><text x="72" y="30" text-anchor="middle" class="violet" font-size="13">FIRMWARE</text><text x="72" y="51" text-anchor="middle" class="bright" font-size="14">Reliable device code</text></g>
      <g transform="translate(330 30)"><rect width="145" height="72" rx="16" fill="#ffffff" stroke="#a7f3d0"/><text x="72" y="30" text-anchor="middle" class="green" font-size="13">CONNECTIVITY</text><text x="72" y="51" text-anchor="middle" class="bright" font-size="14">GNSS / Cellular / BLE</text></g>
      <path d="M145 66h20m145 0h20" stroke="url(#accent)" stroke-width="2"/>
    </g>
    <g transform="translate(0 135)">
      <rect width="475" height="92" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="24" y="30" class="cyan" font-size="13">PRIVATE PRODUCT WORK</text>
      <text x="24" y="55" class="bright" font-size="18" font-weight="700">FarmTrack</text>
      <text x="24" y="76" class="muted" font-size="13">Hardware → Firmware → Telemetry → API → Deployment</text>
    </g>
  </g>
  <rect x="560" y="250" width="1" height="285" fill="#cbd5e1"/>
  <rect x="20" y="555" width="1140" height="55" fill="#ffffff" fill-opacity=".8"/>
  <text x="64" y="588" class="muted" font-size="13">ENGINEERING PHILOSOPHY</text>
  <text x="292" y="588" class="bright" font-size="14">Understand the hardware → design the protocol → build → deploy → automate</text>
</g>
</svg>