<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
<title id="title">Mavin Sandeep — Embedded IoT Systems Engineer</title>
<desc id="desc">Animated developer profile banner focused on embedded systems, IoT, firmware, connectivity and backend systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#0b1224"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000" flood-opacity=".5"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#64748b" stroke-opacity=".08"/></pattern>
  <clipPath id="card"><rect x="20" y="20" width="1140" height="570" rx="30"/></clipPath>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .muted{fill:#94a3b8}.bright{fill:#e2e8f0}.cyan{fill:#67e8f9}.green{fill:#6ee7b7}.violet{fill:#a5b4fc}
    .pulse{animation:pulse 2.8s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.scan{animation:scan 4s linear infinite}
    @keyframes pulse{50%{opacity:.45}} @keyframes float{50%{transform:translateY(-5px)}} @keyframes scan{from{transform:translateY(-90px)}to{transform:translateY(430px)}}
  </style>
</defs>
<g clip-path="url(#card)">
  <rect x="20" y="20" width="1140" height="570" rx="30" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="20" y="20" width="1140" height="570" fill="url(#grid)"/>
  <circle cx="980" cy="80" r="300" fill="url(#glow)"/>
  <circle cx="180" cy="520" r="240" fill="#6366f1" opacity=".08"/>
  <rect x="20" y="20" width="1140" height="3" fill="url(#accent)"/>

  <g transform="translate(64 70)">
    <text class="cyan" font-size="15" letter-spacing="3">MAVIN SANDEEP / SYSTEMS PROFILE</text>
    <text y="58" class="bright" font-size="46" font-weight="700">Building systems that connect</text>
    <text y="106" class="bright" font-size="46" font-weight="700">the physical world to software.</text>
    <text y="143" class="muted" font-size="17">Embedded firmware · IoT · Connectivity · APIs · Linux infrastructure</text>
  </g>

  <g transform="translate(64 260)">
    <rect width="490" height="270" rx="20" fill="#020617" fill-opacity=".58" stroke="#334155"/>
    <text x="24" y="32" class="muted" font-size="13">CURRENT ENGINEERING STACK</text>
    <g transform="translate(24 58)" font-size="16">
      <rect width="442" height="38" rx="10" fill="#0f172a"/><circle cx="20" cy="19" r="5" class="cyan pulse"/><text x="38" y="25" class="bright">ESP32 / STM32 / RL78 / Arduino</text>
      <rect y="48" width="442" height="38" rx="10" fill="#0f172a"/><circle cx="20" cy="67" r="5" class="violet pulse"/><text x="38" y="73" class="bright">UART · SPI · I²C · RS485 · Modbus</text>
      <rect y="96" width="442" height="38" rx="10" fill="#0f172a"/><circle cx="20" cy="115" r="5" class="green pulse"/><text x="38" y="121" class="bright">BLE · Wi-Fi · Cellular · GNSS · W5500</text>
      <rect y="144" width="442" height="38" rx="10" fill="#0f172a"/><circle cx="20" cy="163" r="5" class="cyan pulse"/><text x="38" y="169" class="bright">HTTP · WebSocket · Python · Flask · React</text>
      <rect y="192" width="442" height="38" rx="10" fill="#0f172a"/><circle cx="20" cy="211" r="5" class="green pulse"/><text x="38" y="217" class="bright">Linux · PM2 · systemd · Cloudflare</text>
    </g>
  </g>

  <g transform="translate(590 260)">
    <text class="muted" font-size="13">HOW I BUILD</text>
    <g class="float">
      <g transform="translate(0 30)"><rect width="145" height="72" rx="16" fill="#0f172a" stroke="#164e63"/><text x="72" y="30" text-anchor="middle" class="cyan" font-size="13">HARDWARE</text><text x="72" y="51" text-anchor="middle" class="bright" font-size="14">Sensors / MCU</text></g>
      <g transform="translate(165 30)"><rect width="145" height="72" rx="16" fill="#0f172a" stroke="#3730a3"/><text x="72" y="30" text-anchor="middle" class="violet" font-size="13">FIRMWARE</text><text x="72" y="51" text-anchor="middle" class="bright" font-size="14">Reliable device code</text></g>
      <g transform="translate(330 30)"><rect width="145" height="72" rx="16" fill="#0f172a" stroke="#065f46"/><text x="72" y="30" text-anchor="middle" class="green" font-size="13">CONNECTIVITY</text><text x="72" y="51" text-anchor="middle" class="bright" font-size="14">GNSS / Cellular / BLE</text></g>
      <path d="M145 66h20m145 0h20" stroke="url(#accent)" stroke-width="2"/>
    </g>
    <g transform="translate(0 135)">
      <rect width="475" height="92" rx="16" fill="#0f172a" stroke="#334155"/>
      <text x="24" y="30" class="cyan" font-size="13">PRIVATE PRODUCT WORK</text>
      <text x="24" y="55" class="bright" font-size="18" font-weight="700">FarmTrack</text>
      <text x="24" y="76" class="muted" font-size="13">Hardware → Firmware → Telemetry → API → Deployment</text>
    </g>
  </g>

  <rect x="560" y="250" width="1" height="285" fill="#334155" opacity=".5"/>
  <rect x="20" y="555" width="1140" height="55" fill="#020617" opacity=".65"/>
  <text x="64" y="588" class="muted" font-size="13">ENGINEERING PHILOSOPHY</text>
  <text x="292" y="588" class="bright" font-size="14">Understand the hardware → design the protocol → build → deploy → automate</text>
  <rect class="scan" x="0" y="0" width="1180" height="90" fill="url(#glow)" opacity=".15"/>
</g>
</svg>