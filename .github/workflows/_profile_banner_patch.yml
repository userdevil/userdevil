name: One-time profile banner patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch existing SVG content only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ascii_lines = [
              "        .-=================-.",
              "      .'   .-----------.   '.",
              "     /    /   +-----+   \\    \\",
              "    /    |    | MCU |    |    \\",
              "   |     |  .-+-----+-.  |     |",
              "   |  o--+--| GPIO  |--+--o  |",
              "   |     |  | UART  |  |     |",
              "   |  o--+--| SPI   |--+--o  |",
              "   |     |  | I2C   |  |     |",
              "   |  o--+--| RS485 |--+--o  |",
              "    \\    |  +-------+  |    /",
              "     \\   +-----+ +-----+   /",
              "      \\____|___|_|___|____/",
              "          |   |   |   |",
              "      o---+   +---+   +---o",
              "        PCB  // DATA //  BUS",
              "        .-----------------.",
          ]

          def patch_svg(path):
              text = Path(path).read_text(encoding='utf-8')
              start = '    <!-- floating, glowing, gradient ASCII portrait -->'
              end = '    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".7s" begin="1s" fill="freeze"/>'
              a = text.index(start)
              b = text.index(end, a)

              rows = []
              for i, line in enumerate(ascii_lines):
                  y = 160 + i * 15
                  rows.append(f'        <g clip-path="url(#lc{i})"><text x="255" y="{y}">{line}</text></g>')
              row_markup = '\n'.join(rows)

              replacement = f'''    <!-- floating, glowing, gradient electronics ASCII -->
              <g>
                <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="6s" repeatCount="indefinite"/>
                <g filter="url(#glowA)" font-size="14" text-anchor="middle" fill="url(#ascG)">
                  <animate attributeName="opacity" values="1;.965;1;.985;1" dur="3s" repeatCount="indefinite"/>
          {row_markup}
                  <g opacity=".95" fill="#22D3EE">
                    <circle cx="88" cy="185" r="2"><animate attributeName="cx" values="88;420;88" dur="3.8s" repeatCount="indefinite"/></circle>
                    <circle cx="420" cy="335" r="2"><animate attributeName="cx" values="420;88;420" dur="4.6s" begin="-.9s" repeatCount="indefinite"/></circle>
                    <circle cx="100" cy="410" r="1.7"><animate attributeName="cy" values="410;145;410" dur="5.2s" begin="-2s" repeatCount="indefinite"/></circle>
                  </g>
                  <rect x="366" y="390" width="9" height="14" rx="1.5">
                    <animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;.55" dur="1.1s" repeatCount="indefinite"/>
                  </rect>
                </g>
                <g clip-path="url(#vp)" opacity=".9">
                  <rect x="64" y="96" width="382" height="34" fill="url(#scanG)"/>
                  <rect x="64" y="112" width="382" height="1.6" fill="#22D3EE" opacity=".5"/>
                  <animateTransform attributeName="transform" type="translate" values="0 0;0 400" dur="4.2s" repeatCount="indefinite"/>
                </g>
              </g>

          '''
              text = text[:a] + replacement + text[b:]
              text = text.replace('>Tech Entrepreneur</text>', '>Firmware Engineer</text>')
              text = text.replace('>Android Developer</text>', '>Embedded Engineer</text>')
              text = text.replace('>IoT Enthusiast</text>', '>IoT Engineer</text>')
              text = text.replace('>Web Developer</text>', '>Hardware Eng.</text>')
              text = text.replace('>Embedded Systems · Web</text>', '>Embedded · IoT · Firmware</text>')
              text = text.replace('>▸ neofetch · glow</text>', '>▸ circuit · glow</text>')
              Path(path).write_text(text, encoding='utf-8', newline='')

          patch_svg('dark.svg')
          patch_svg('light.svg')
          PY

      - name: Commit changes and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg .github/workflows/_profile_banner_patch.yml
          git rm .github/workflows/_profile_banner_patch.yml
          git commit -m "Fix electronics profile banner"
          git push
