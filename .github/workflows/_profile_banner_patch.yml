name: One-time profile banner patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch existing SVG content only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ascii_lines = [
              "        .-=================-.",
              "      .'   .-----------.   '.",
              "     /    /   +-----+   \\    \\",
              "    /    |    | MCU |    |    \\",
              "   |     |  .-+-----+-.  |     |",
              "   |  o--+--| GPIO  |--+--o  |",
              "   |     |  | UART  |  |     |",
              "   |  o--+--| SPI   |--+--o  |",
              "   |     |  | I2C   |  |     |",
              "   |  o--+--| RS485 |--+--o  |",
              "    \\    |  +-------+  |    /",
              "     \\   +-----+ +-----+   /",
              "      \\____|___|_|___|____/",
              "          |   |   |   |",
              "      o---+   +---+   +---o",
              "        PCB  // DATA //  BUS",
              "        .-----------------.",
          ]

          def patch_svg(path):
              text = Path(path).read_text(encoding='utf-8')

              # Surgical replacement: only the 17 existing ASCII text nodes.
              for i, line in enumerate(ascii_lines):
                  needle = f'<g clip-path="url(#lc{i})"><text x="255" y="'
                  a = text.index(needle)
                  b = text.index('</text></g>', a) + len('</text></g>')
                  prefix_end = text.index('>', a) + 1
                  prefix = text[a:prefix_end]
                  text = text[:a] + prefix + line + '</text></g>' + text[b:]

              # Keep the terminal UI, but make the rotating role content match
              # the electronics/embedded focus.
              replacements = {
                  '>Tech Entrepreneur</text>': '>Firmware Engineer</text>',
                  '>Android Developer</text>': '>Embedded Engineer</text>',
                  '>IoT Enthusiast</text>': '>IoT Engineer</text>',
                  '>Web Developer</text>': '>Hardware Eng.</text>',
                  '>Embedded Systems · Web</text>': '>Embedded · IoT · Firmware</text>',
                  '>▸ neofetch · glow</text>': '>▸ circuit · glow</text>',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)

              Path(path).write_text(text, encoding='utf-8', newline='')

          patch_svg('dark.svg')
          patch_svg('light.svg')
          PY

      - name: Commit changes and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg .github/workflows/_profile_banner_patch.yml
          git rm .github/workflows/_profile_banner_patch.yml
          git commit -m "Fix electronics profile banner"
          git push
